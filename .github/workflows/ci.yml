name: CI

on:
  push:
    branches: [main]
    paths: &go-paths
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/ci.yml
  pull_request:
    paths: *go-paths

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
